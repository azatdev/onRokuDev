query DetailsScreen($documentId: ID!) {
  content(documentId: $documentId) {
    complimentaryColor
    copyrightYear
    description
    documentId
    duration
    playlistUrl
    v2genres {
      name
    }
    rating
    title
    type
    images {
      imageType
      data {
        url
      }
    }
    carousels {
      carouselTitle
      carouselType
      documentId
      thumbnailType
    }
  }
}
